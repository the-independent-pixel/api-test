<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">

  <!-- ======================================================
       VIEWPORT E BROWSER
       ====================================================== -->

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#293e2f"
  >

  <meta
    name="color-scheme"
    content="light"
  >


  <!-- ======================================================
       SEO BASE
       Sostituire i placeholder per ogni singola pagina.
       ====================================================== -->

  <title>[Titolo pagina] | Associazione di Quartiere Fontana Candida 2.0</title>

  <meta
    name="description"
    content="[Descrizione sintetica e specifica della pagina, indicativamente tra 140 e 160 caratteri.]"
  >

  <meta
    name="robots"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  >

  <meta
    name="author"
    content="Associazione di Quartiere Fontana Candida 2.0"
  >

  <meta
    name="application-name"
    content="Associazione di Quartiere Fontana Candida 2.0"
  >

  <link
    rel="canonical"
    href="https://[dominio]/[percorso-pagina]/"
  >

  <link
    rel="alternate"
    hreflang="it"
    href="https://[dominio]/[percorso-pagina]/"
  >

  <link
    rel="alternate"
    hreflang="x-default"
    href="https://[dominio]/[percorso-pagina]/"
  >


  <!-- ======================================================
       OPEN GRAPH
       Facebook, WhatsApp, LinkedIn e altri servizi.
       ====================================================== -->

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:locale"
    content="it_IT"
  >

  <meta
    property="og:site_name"
    content="Associazione di Quartiere Fontana Candida 2.0"
  >

  <meta
    property="og:title"
    content="[Titolo pagina]"
  >

  <meta
    property="og:description"
    content="[Descrizione sintetica della pagina per la condivisione.]"
  >

  <meta
    property="og:url"
    content="https://[dominio]/[percorso-pagina]/"
  >

  <meta
    property="og:image"
    content="https://[dominio]/assets/images/social/[immagine-condivisione].webp"
  >

  <meta
    property="og:image:alt"
    content="[Descrizione significativa dell'immagine di condivisione]"
  >

  <meta
    property="og:image:width"
    content="1200"
  >

  <meta
    property="og:image:height"
    content="630"
  >


  <!-- ======================================================
       X / TWITTER CARD
       ====================================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="[Titolo pagina]"
  >

  <meta
    name="twitter:description"
    content="[Descrizione sintetica della pagina per la condivisione.]"
  >

  <meta
    name="twitter:image"
    content="https://[dominio]/assets/images/social/[immagine-condivisione].webp"
  >

  <meta
    name="twitter:image:alt"
    content="[Descrizione significativa dell'immagine di condivisione]"
  >

  <!-- ======================================================
       PRELOAD CSS
       Il progetto utilizza un unico file CSS globale.
       ====================================================== -->

  <link
    rel="preload"
    href="/assets/css/styles.css"
    as="style"
  >

  <link
    rel="stylesheet"
    href="/assets/css/styles.css"
  >
</head>

<body data-site-bar-page>
  <h1>CIAONEEEEEEEEE !!!</h1>
</body>
</html>
